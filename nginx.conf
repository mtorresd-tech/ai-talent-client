server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Assets con hash en el nombre generados por Vite (dist/assets): cache
    # agresivo e inmutable. Una ruta inexistente responde 404 real, sin caer
    # al fallback de la SPA.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html no se cachea: cada deploy debe servir la última versión, que
    # referencia los assets con hash actualizados.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing de react-router-dom: cualquier ruta de navegación
    # que no coincide con un archivo real cae al index.html de la SPA.
    location / {
        try_files $uri /index.html;
    }
}
